name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  harness:
    name: Public harness (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            node: 22
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:harness-tests
      - run: npm run test:harness:baseline
      - run: npm run test:harness
      - run: npm run test:novel-domain
      - run: npm run build:frontend
      - name: Upload synthetic traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-${{ matrix.os }}-node${{ matrix.node }}
          path: artifacts/harness/*.json
          retention-days: 7
          if-no-files-found: warn

  validate:
    name: Validate (TypeScript + Rust)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Linux dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Frontend build
        run: npm run build:frontend

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: RPC generation regression
        run: cargo test --manifest-path src-tauri/Cargo.toml rpc_generation_tests

      - name: Session file safety regression
        run: cargo test --manifest-path src-tauri/Cargo.toml session_file::tests
