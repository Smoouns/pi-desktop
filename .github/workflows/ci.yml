name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  harness:
    name: Public harness (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            node: 22
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:harness-tests
      - run: npm run test:harness:baseline
      - run: npm run test:harness
      - run: npm run test:harness:long-horizon
      - run: npm run test:production-lifecycle
      - run: npm run test:novel-domain
      - run: npm run test:evals
      - run: npm run test:pilot
      - name: Pilot Windows short TEMP regression
        if: runner.os == 'Windows'
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/test-pilot-journal-windows.ps1
      - run: npm run test:sdk-ablation
      - run: npm run test:sdk-live
      - run: npm run test:sdk-context
      - run: npm run test:sdk-lifecycle
      - run: npm run test:sdk-context-transport
      - run: npm run test:sdk-context-live
      - run: npm run test:sdk-recovery-races
      - run: npm run test:sdk-supervision
      - run: npm run test:sdk-supervision-live
      - run: npm run test:evidence-report
      - run: npm run test:chat-panel-resize
      - run: npm run build:frontend
      - name: Upload synthetic traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            artifacts/harness/*.json
            artifacts/harness/production-lifecycle/**/*.json
            artifacts/harness/evals/**/*.json
            artifacts/harness/pilot-rehearsals/**/*.json
            artifacts/harness/live-pilots/dry-run-*/**/*.json
            artifacts/harness/sdk-ablations/**/*.json
            artifacts/harness/sdk-live/s2-dry-*/**/*.json
            artifacts/harness/sdk-context/s3-offline-*/**/*.json
            artifacts/harness/sdk-context/s3-lifecycle-*/**/*.json
            artifacts/harness/sdk-context-transport/s3-transport-*/**/*.json
            artifacts/harness/sdk-context-live/s3-dry-*/**/*.json
            artifacts/harness/sdk-recovery-races/s3-races-*/**/*.json
            artifacts/harness/sdk-supervision/**/*.json
            artifacts/harness/sdk-supervision-live/s4-dry-*/**/*.json
          retention-days: 7
          if-no-files-found: warn

  validate:
    name: Validate (TypeScript + Rust, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            node: 22
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Frontend build
        run: npm run build:frontend

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: RPC generation regression
        run: cargo test --manifest-path src-tauri/Cargo.toml rpc_generation_tests

      - name: Session file safety regression
        run: cargo test --manifest-path src-tauri/Cargo.toml session_file::tests

      - name: Novel role branch isolation regression
        run: cargo test --manifest-path src-tauri/Cargo.toml novel_role_session_tests

      - name: Windows RPC console regression
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib windows_process_tests -- --nocapture
